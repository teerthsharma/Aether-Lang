[package]
name = "aegis-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "AEGIS Cross-Platform CLI - Run AEGIS on Windows, Linux, macOS"

# ═══════════════════════════════════════════════════════════════════════════════
# AEGIS CLI (Cross-Platform Native Binary)
# ═══════════════════════════════════════════════════════════════════════════════
#
# The primary user-facing tool for running AEGIS programs.
# Compiles natively on Windows, Linux, and macOS.
#
# Commands:
#   aegis repl              Interactive REPL
#   aegis run <file.aegis>  Execute a script
#   aegis check <file.aegis> Syntax validation
#
# Build:
#   cargo build -p aegis-cli --release
#
# ═══════════════════════════════════════════════════════════════════════════════

[features]
default = []

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-lang = { path = "../aether-lang", package = "aether-lang" }
clap = { workspace = true }
rustyline = { workspace = true }

[[bin]]
name = "aegis"
path = "src/main.rs"

# Denied for this package only, matching the other crates in this workspace.
# Not through RUSTFLAGS, which would apply to every dependency and fail this
# build for a warning in one of them.
#
# Added after surveying every configuration this crate has and finding none:
# the denial follows the reading rather than replacing it. Where that order was
# reversed elsewhere, `cargo fix` offered to delete two bindings whose only
# reader was a std-gated `println!` and which were doing load-bearing work.
[lints.rust]
unused_imports = "deny"
