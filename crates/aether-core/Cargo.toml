[package]
name = "aether-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AETHER Core: Platform-agnostic topology, manifold, and ML primitives"

# ═══════════════════════════════════════════════════════════════════════════════
# AETHER Core Library
# ═══════════════════════════════════════════════════════════════════════════════
#
# This crate provides the mathematical foundation for AETHER:
#   - Topology: Betti numbers, shape verification, TDA
#   - Manifold: Time-delay embedding, sparse attention
#   - AETHER: Hierarchical blocks, geometric primitives
#   - ML: Regression, convergence detection
#
# Supports both `no_std` (for kernel) and `std` (for CLI) via features.
#
# ═══════════════════════════════════════════════════════════════════════════════

[features]
default = ["std"]
std = ["alloc"]                 # Use standard library
alloc = []                      # Use alloc crate (no_std with allocator)
no_std = ["alloc"]              # Bare-metal mode

[dependencies]
libm = { workspace = true }
# serde = { workspace = true }
nalgebra = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]

[lib]
name = "aether_core"
path = "src/lib.rs"

# Denied for this package only, not through RUSTFLAGS.
#
# An `alloc::boxed::Box` import sat unused in `memory.rs` under
# `cfg(not(feature = "std"))` with nothing catching it: the workspace clippy gate
# denies warnings, but it runs for the host target, where that `cfg` is off and
# the import does not exist. A warning reachable only in the bare-metal
# configuration had no gate at all.
#
# `RUSTFLAGS="-D warnings"` on the CI step would have caught it and would also
# apply to every dependency, so a future `nalgebra` emitting a warning would fail
# this build for something outside this repository. A `[lints]` table applies to
# this package and nothing else.
#
# Narrow on purpose. Denying all of `unused` invites a future nightly adding a
# lint to that group to fail the build with no commit touching the code, which is
# the standing exposure already documented for the clippy groups in CI.
[lints.rust]
unused_imports = "deny"
