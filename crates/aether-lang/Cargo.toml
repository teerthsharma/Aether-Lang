[package]
name = "aether-lang"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AETHER Language: Lexer, Parser, AST, and Interpreter"

# ═══════════════════════════════════════════════════════════════════════════════
# AETHER Language Compiler/Interpreter
# ═══════════════════════════════════════════════════════════════════════════════
#
# The complete AETHER language implementation:
#   - Lexer: Tokenizes .aether source files
#   - AST: Abstract Syntax Tree with tilde (~) terminators
#   - Parser: Builds AST from token stream
#   - Interpreter: Executes AETHER programs
#
# Features:
#   - Seal loops (🦭) with topological convergence
#   - Manifold primitives (embed, block, cluster)
#   - Control flow (if, for, while, fn)
#
# ═══════════════════════════════════════════════════════════════════════════════

[features]
default = ["std"]
# `std` used to pull reqwest, safetensors, wgpu, pollster and bytemuck. All five
# had zero call sites -- `grep -rn 'wgpu\|pollster\|bytemuck\|reqwest\|safetensors'
# crates/aether-lang/src` returns nothing -- so every default build compiled an
# HTTP client and a GPU stack that no line of code referenced. GPU work lives in
# the `aether-gpu` crate, which depends on a current wgpu rather than the 0.17
# pinned here since 2023.
std = ["aether-core/std", "alloc"]
ml = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
alloc = []
no_std = ["aether-core/no_std", "alloc"]
python = ["dep:pyo3", "std"]

[dependencies]
aether-core = { path = "../aether-core", default-features = false }
libm = { workspace = true }
heapless = { workspace = true }
candle-core = { version = "0.3.3", optional = true }
candle-transformers = { version = "0.3.3", optional = true }
tokenizers = { version = "0.15.2", optional = true }
hf-hub = { version = "0.3.2", features = ["tokio"], optional = true }
rand = { version = "0.8.5", default-features = false, features = ["alloc", "small_rng"] }
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[lib]
name = "aether_lang"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Denied for this package only. See the same table in aether-core for why not
# RUSTFLAGS: that would apply to every dependency, and a future one emitting a
# warning would fail this build for something outside this repository.
#
# Added once the crate's bare-metal warnings had been read rather than counted.
# Seven were dead code and two were bindings whose only reader is a std-gated
# `println!` -- both doing load-bearing work, and both of which `cargo fix` would
# have deleted. Denying a class before surveying it is how a mechanical fix gets
# reached for; the survey is what makes this narrow lint safe to turn on.
[lints.rust]
unused_imports = "deny"
