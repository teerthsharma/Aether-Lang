[package]
name = "aether-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AETHER GPU: wgpu compute backend for aether-core tensor operations"

# ═══════════════════════════════════════════════════════════════════════════════
# AETHER GPU
# ═══════════════════════════════════════════════════════════════════════════════
#
# Deliberately a separate crate rather than a feature on aether-core.
#
# aether-core is no_std and builds for thumbv7m-none-eabi. wgpu requires std,
# an allocator, and a windowing/driver stack. Putting the GPU backend behind a
# feature flag on aether-core would leave a no_std crate whose dependency graph
# only resolves on hosted targets, and the Cortex-M3 build is a load-bearing
# claim. A separate crate keeps that boundary enforced by the build rather
# than by discipline.
#
# Precision: WGSL has no f64. aether-core computes in f64. Every kernel here
# is f32, so GPU results are compared against the CPU path at f32 tolerance,
# never at the 1e-12 used elsewhere in this workspace.
# ═══════════════════════════════════════════════════════════════════════════════

[features]
# Tests that need a real adapter are `#[ignore]`d unless this is on.
#
# Not because they are slow or flaky, but because without it they would *pass*
# without running. A test that returns early on a missing adapter reports
# success, so `cargo test --workspace` on a GPU-less runner shows the whole
# hardware suite green while executing none of it. Marked ignored, the same run
# prints "N ignored" instead, which is the difference between a report and a
# lie.
#
# Off by default so CI is honest without configuration. Turn it on to run them:
#
#   cargo test -p aether-gpu --features gpu --release
gpu = []

[dependencies]
aether-core = { path = "../aether-core" }
wgpu = "27.0"
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }

[dev-dependencies]
