name: AETHER CI

# Triggers on the branch this repository actually uses. The previous config
# listed `main`/`develop`, neither of which exists here, so no run had ever
# executed and the workspace had drifted out of compiling.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Test & Lint (Matrix)
  #
  # `aether-kernel` is excluded here on purpose: it is a `no_std` bare-metal
  # binary with no global allocator or panic handler, so it cannot link for a
  # host target. It is built for real in the `kernel` job below.
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'

      # Denies the two lint groups that find real defects, plus every rustc
      # warning — an unused import fails this job. The reasoning for not denying
      # more: a gate nobody can keep green gets switched off, and then the
      # correctness lints stop being enforced with it.
      #
      # Style, complexity and perf are `-A`, which silences them rather than
      # leaving them as warnings. That is not the preference, it is the only
      # option: `-D warnings` is a blanket cap that promotes anything emitting a
      # warning into an error, and a later `-W clippy::style` does not override
      # it — tried, and the job fails on every style lint just the same. Keeping
      # the rustc-warning denial therefore costs visibility of the clippy style
      # groups, and this comment said they "stay warnings" until someone ran it.
      #
      # What is being silenced is printed by the advisory step below rather than
      # counted here. An earlier revision of this comment stated the number, which
      # is the kind of claim this repository keeps finding stale — and it was
      # already understated, naming only `aether-core` when `aether-gpu`,
      # `aether-lang` and most of the examples carry them too.
      #
      # The standing exposure is worth stating and does not go stale: the
      # toolchain is unpinned nightly, so a release that promotes one of these
      # lints into `correctness` or `suspicious` turns this job red with no commit
      # touching the code. Several are `neg_cmp_op_on_partial_ord` on floats,
      # where the mechanical rewrite changes NaN behaviour, so the advisory output
      # is a list to read before acting on rather than one to hand to `--fix`.
      - name: Clippy (correctness + suspicious)
        run: >
          cargo clippy --workspace --exclude aether-kernel --all-targets --
          -D warnings
          -D clippy::correctness
          -D clippy::suspicious
          -A clippy::style
          -A clippy::complexity
          -A clippy::perf

      # Prints what the gate above silences. Never fails.
      #
      # Documenting the count in a comment was the previous arrangement and it is
      # the weaker one: a number in a comment is exactly the claim this repository
      # keeps finding stale, and it would drift the first time somebody wrote
      # another indexed loop. This puts the current list in the log of every run
      # instead, where it costs nothing to read and cannot go out of date.
      #
      # Separate from the gate rather than folded into it because `-D warnings`
      # and a visible style lint are mutually exclusive in one invocation: the cap
      # promotes anything that warns into an error, so the only way to have both a
      # denied unused import and a printed `needless_range_loop` is two runs.
      #
      # `continue-on-error` is belt and braces. Clippy exits zero on warnings, so
      # this step passes on its own; the flag states that it must never do
      # otherwise, so a future lint promoted to deny-by-default cannot quietly
      # turn an advisory step into a gate.
      - name: Clippy (style, advisory - never fails)
        continue-on-error: true
        run: >
          cargo clippy --workspace --exclude aether-kernel --all-targets --
          -W clippy::style
          -W clippy::complexity
          -W clippy::perf

      # The aether-gpu hardware tests are #[ignore]d unless its `gpu` feature is
      # on, so this run reports them as "ignored" rather than "passed". That
      # matters: they used to return early on a missing adapter, and an early
      # return is a pass, so this job reported roughly forty GPU tests green
      # while executing none of them.
      #
      # To actually run them, on a runner that has a GPU:
      #
      #   cargo test -p aether-gpu --features gpu --release
      #
      # The feature is the only switch. Asking for the hardware tests and
      # finding no adapter fails rather than skipping, so the run cannot
      # silently degrade back to reporting nothing.
      - name: Run Tests
        run: cargo test --workspace --exclude aether-kernel

      # Compile the hardware tests even though they cannot run here, so a
      # compile error in them is caught rather than hidden behind the ignore.
      # This is the cost of the ignore: without it, a broken GPU test would sit
      # unnoticed until someone with an adapter ran the suite.
      - name: Build GPU tests (compile only, no adapter on runners)
        run: cargo build -p aether-gpu --tests --features gpu

  # ═══════════════════════════════════════════════════════════════════════════
  # Topological correctness gate
  #
  # The persistence invariant suite is called out separately so a failure names
  # itself in the checks list. These are the assertions that distinguish a
  # correct persistent homology implementation from a plausible-looking wrong
  # one; a benchmark measured on a wrong implementation is not a result.
  # ═══════════════════════════════════════════════════════════════════════════
  invariants:
    name: Persistence Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test -p aether-core --test persistence_invariants
      - run: cargo test -p aether-core --test persistence_scale --release
      - run: cargo test -p aether-core --test diagram_distance
      - run: cargo test -p aether-core --test attention_contracts -- --nocapture
      - run: cargo test -p aether-core --test scheduled_attention -- --nocapture
      - run: cargo test -p aether-core --lib persistence

  # ═══════════════════════════════════════════════════════════════════════════
  # no_std Compatibility Check
  # ═══════════════════════════════════════════════════════════════════════════
  no_std_check:
    name: no_std Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: thumbv7m-none-eabi

      - name: Build Core (no_std)
        run: >
          cargo build -p aether-core --no-default-features --features no_std
          -Z build-std=core,alloc --target thumbv7m-none-eabi

      # aegis-core declares `std` and `alloc` features and nothing built the
      # configuration without `std`. It is not a dependency of aether-kernel, so
      # unlike aether-core and aether-lang it was never compiled for a bare-metal
      # target even indirectly, and its `extern crate alloc` -- which a host build
      # reports as unused and a no_std build requires -- was protected by nothing.
      #
      # Built here rather than a comment asked to hold the invariant.
      - name: Build Aegis Core (no_std)
        run: >
          cargo build -p aegis-core --no-default-features --features alloc
          -Z build-std=core,alloc --target thumbv7m-none-eabi

  # ═══════════════════════════════════════════════════════════════════════════
  # Bare-metal kernel
  # ═══════════════════════════════════════════════════════════════════════════
  kernel:
    name: Kernel (x86_64-unknown-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none

      - name: Build Kernel
        run: >
          cargo build -p aether-kernel
          -Z build-std=core,alloc --target x86_64-unknown-none

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Build
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aether:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker CLI
        run: docker run --rm aether:test --help

  # ═══════════════════════════════════════════════════════════════════════════
  # Release
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, invariants, no_std_check, kernel, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
