name: AETHER CI

# Triggers on the branch this repository actually uses. The previous config
# listed `main`/`develop`, neither of which exists here, so no run had ever
# executed and the workspace had drifted out of compiling.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Test & Lint (Matrix)
  #
  # `aether-kernel` is excluded here on purpose: it is a `no_std` bare-metal
  # binary with no global allocator or panic handler, so it cannot link for a
  # host target. It is built for real in the `kernel` job below.
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'

      # Denies the two lint groups that find real defects. Style, complexity and
      # perf lints stay warnings: a gate nobody can keep green gets switched off,
      # and then correctness lints stop being enforced too.
      - name: Clippy (correctness + suspicious)
        run: >
          cargo clippy --workspace --exclude aether-kernel --all-targets --
          -D warnings
          -D clippy::correctness
          -D clippy::suspicious
          -A clippy::style
          -A clippy::complexity
          -A clippy::perf

      # These runners have no GPU, so every test in `aether-gpu` that needs an
      # adapter returns early — and an early return is a pass. This job
      # therefore reports the GPU suites green while running none of them.
      #
      # `AETHER_REQUIRE_GPU=1` turns a missing adapter into a failure. It is
      # deliberately NOT set here, because it would fail every run on hardware
      # that cannot satisfy it. Set it on a GPU-equipped runner, or locally, to
      # assert that the hardware path was actually exercised:
      #
      #   AETHER_REQUIRE_GPU=1 cargo test -p aether-gpu --release
      #
      # Until such a runner exists, the GPU rows in the README's status
      # dashboard are marked as verified on developer hardware rather than in
      # CI, which is a weaker claim than the other rows carry.
      - name: Run Tests
        run: cargo test --workspace --exclude aether-kernel

  # ═══════════════════════════════════════════════════════════════════════════
  # Topological correctness gate
  #
  # The persistence invariant suite is called out separately so a failure names
  # itself in the checks list. These are the assertions that distinguish a
  # correct persistent homology implementation from a plausible-looking wrong
  # one; a benchmark measured on a wrong implementation is not a result.
  # ═══════════════════════════════════════════════════════════════════════════
  invariants:
    name: Persistence Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test -p aether-core --test persistence_invariants
      - run: cargo test -p aether-core --test persistence_scale --release
      - run: cargo test -p aether-core --test diagram_distance
      - run: cargo test -p aether-core --test attention_contracts -- --nocapture
      - run: cargo test -p aether-core --test scheduled_attention -- --nocapture
      - run: cargo test -p aether-core --lib persistence

  # ═══════════════════════════════════════════════════════════════════════════
  # no_std Compatibility Check
  # ═══════════════════════════════════════════════════════════════════════════
  no_std_check:
    name: no_std Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: thumbv7m-none-eabi

      - name: Build Core (no_std)
        run: >
          cargo build -p aether-core --no-default-features --features no_std
          -Z build-std=core,alloc --target thumbv7m-none-eabi

  # ═══════════════════════════════════════════════════════════════════════════
  # Bare-metal kernel
  # ═══════════════════════════════════════════════════════════════════════════
  kernel:
    name: Kernel (x86_64-unknown-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-none

      - name: Build Kernel
        run: >
          cargo build -p aether-kernel
          -Z build-std=core,alloc --target x86_64-unknown-none

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Build
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aether:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker CLI
        run: docker run --rm aether:test --help

  # ═══════════════════════════════════════════════════════════════════════════
  # Release
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, invariants, no_std_check, kernel, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
